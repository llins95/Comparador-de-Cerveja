name: Cerva Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publicar APK Android assinado no GitHub Releases
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.0

      - name: Unit tests
        run: gradle testDebugUnitTest

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Create debug checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cerva-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

  release_android:
    name: Publish signed Android release
    needs: build
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish_release) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.0

      - name: Verify signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Repository Secret ausente: $variable"
              missing=1
            fi
          done
          exit "$missing"

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/cerva-release.jks

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/app/cerva-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Verify signature and prepare release
        id: release
        run: |
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$apksigner_path" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

          version_name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          version_code="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          tag="v${version_name}+${version_code}"

          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/Cerva.apk
          (cd release && sha256sum Cerva.apk > Cerva.apk.sha256)

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Ensure version is new
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG"; then
            echo "::error::A versão $RELEASE_TAG já foi publicada. Aumente versionCode/versionName."
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            release/Cerva.apk \
            release/Cerva.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "Cerva $RELEASE_VERSION" \
            --generate-notes

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: cerva-signed-${{ steps.release.outputs.tag }}
          path: |
            release/Cerva.apk
            release/Cerva.apk.sha256
          if-no-files-found: error
          retention-days: 90

  bootstrap_release:
    name: Bootstrap first permanent signing key
    needs: build
    if: >-
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[bootstrap-release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.0

      - name: Generate permanent Cerva signing key
        run: |
          store_password="$(openssl rand -hex 24)"
          key_password="$(openssl rand -hex 24)"
          alias_name="cerva"

          echo "::add-mask::$store_password"
          echo "::add-mask::$key_password"

          keytool -genkeypair \
            -keystore app/cerva-release.jks \
            -storetype JKS \
            -storepass "$store_password" \
            -keypass "$key_password" \
            -alias "$alias_name" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=Cerva, O=Cerva, C=BR"

          echo "ANDROID_KEYSTORE_PASSWORD=$store_password" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$key_password" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$alias_name" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PATH=${{ github.workspace }}/app/cerva-release.jks" >> "$GITHUB_ENV"

          mkdir -p signing-backup
          cp app/cerva-release.jks signing-backup/cerva-release.jks
          base64 -w0 app/cerva-release.jks > signing-backup/ANDROID_KEYSTORE_BASE64.txt
          printf '%s\n' \
            "ANDROID_KEYSTORE_PASSWORD=$store_password" \
            "ANDROID_KEY_ALIAS=$alias_name" \
            "ANDROID_KEY_PASSWORD=$key_password" \
            > signing-backup/credenciais.txt

          cat > signing-backup/configurar-github-secrets.ps1 <<'POWERSHELL'
          $ErrorActionPreference = "Stop"
          $pasta = Split-Path -Parent $MyInvocation.MyCommand.Path
          $base64 = (Get-Content (Join-Path $pasta "ANDROID_KEYSTORE_BASE64.txt") -Raw).Trim()
          $dados = @{}
          Get-Content (Join-Path $pasta "credenciais.txt") | ForEach-Object {
            $partes = $_ -split '=', 2
            if ($partes.Length -eq 2) { $dados[$partes[0]] = $partes[1] }
          }
          $base64 | gh secret set ANDROID_KEYSTORE_BASE64 -R llins95/Comparador-de-Cerveja
          $dados["ANDROID_KEYSTORE_PASSWORD"] | gh secret set ANDROID_KEYSTORE_PASSWORD -R llins95/Comparador-de-Cerveja
          $dados["ANDROID_KEY_ALIAS"] | gh secret set ANDROID_KEY_ALIAS -R llins95/Comparador-de-Cerveja
          $dados["ANDROID_KEY_PASSWORD"] | gh secret set ANDROID_KEY_PASSWORD -R llins95/Comparador-de-Cerveja
          Write-Host "Secrets da Cerva configurados no GitHub."
          POWERSHELL

      - name: Build permanently signed APK
        run: gradle assembleRelease

      - name: Verify signature and prepare first release
        id: bootstrap
        run: |
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$apksigner_path" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

          version_name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          version_code="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          tag="v${version_name}+${version_code}"

          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/Cerva.apk
          (cd release && sha256sum Cerva.apk > Cerva.apk.sha256)

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Ensure bootstrap version is new
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.bootstrap.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG"; then
            echo "::error::A versão $RELEASE_TAG já existe. O bootstrap não será repetido."
            exit 1
          fi

      - name: Publish first signed GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.bootstrap.outputs.tag }}
          RELEASE_VERSION: ${{ steps.bootstrap.outputs.version_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            release/Cerva.apk \
            release/Cerva.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "Cerva $RELEASE_VERSION" \
            --notes "Primeira versão assinada da Cerva. Inclui Material 3, ícone aprovado, comparação de preços e o sistema de atualização automática no modelo do FinFlow."

      - name: Upload signing backup for repository owner
        uses: actions/upload-artifact@v4
        with:
          name: cerva-signing-backup
          path: signing-backup
          if-no-files-found: error
          retention-days: 1

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cerva-signed-${{ steps.bootstrap.outputs.tag }}
          path: |
            release/Cerva.apk
            release/Cerva.apk.sha256
          if-no-files-found: error
          retention-days: 90
