name: Patch simulator edit button

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-simulator-edit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python .github/scripts/patch_simulator.py

      - name: Commit fix
        run: |
          rm .github/workflows/patch-simulator-edit.yml
          rm .github/scripts/patch_simulator.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: adicionar edição de promoções no simulador"
          git push
