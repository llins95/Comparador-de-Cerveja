name: Apply Top 5 store and publish Cerva

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-top5-store-release.yml'

permissions:
  contents: write

jobs:
  apply_build_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.0

      - name: Apply Top 5 store label and bump version
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('app/src/main/java/com/llins95/comparadordecerveja/ui/BeerApp.kt')
          text = app.read_text()
          old = '''@Composable
          private fun OfferRow(offer: BeerOfferEntity) {
              ElevatedCard(
                  modifier = Modifier.fillMaxWidth(),
                  shape = MaterialTheme.shapes.large,
                  colors = CardDefaults.elevatedCardColors(
                      containerColor = MaterialTheme.colorScheme.surfaceContainerLow
                  )
              ) {
                  Row(
                      modifier = Modifier.fillMaxWidth().padding(18.dp),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      Column(Modifier.weight(1f)) {
                          Text(offer.brand, style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.SemiBold)
                          Text(
                              offerDescription(offer),
                              style = MaterialTheme.typography.bodySmall,
                              color = MaterialTheme.colorScheme.onSurfaceVariant
                          )
                      }
                      PricePill(offer.pricePerLiter)
                  }
              }
          }
          '''
          new = '''@Composable
          private fun OfferRow(offer: BeerOfferEntity) {
              ElevatedCard(
                  modifier = Modifier.fillMaxWidth(),
                  shape = MaterialTheme.shapes.large,
                  colors = CardDefaults.elevatedCardColors(
                      containerColor = MaterialTheme.colorScheme.surfaceContainerLow
                  )
              ) {
                  Row(
                      modifier = Modifier.fillMaxWidth().padding(18.dp),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      Column(Modifier.weight(1f)) {
                          Text(offer.brand, style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.SemiBold)
                          Text(
                              offerDescription(offer),
                              style = MaterialTheme.typography.bodySmall,
                              color = MaterialTheme.colorScheme.onSurfaceVariant
                          )
                          if (offer.store.isNotBlank()) {
                              Text(
                                  "Loja: ${offer.store}",
                                  style = MaterialTheme.typography.bodySmall,
                                  color = MaterialTheme.colorScheme.primary,
                                  fontWeight = FontWeight.Medium
                              )
                          }
                      }
                      PricePill(offer.pricePerLiter)
                  }
              }
          }
          '''
          if old not in text:
              raise SystemExit('OfferRow esperado não foi encontrado; abortando para evitar alteração incorreta.')
          app.write_text(text.replace(old, new, 1))

          gradle = Path('app/build.gradle.kts')
          build = gradle.read_text()
          if 'versionCode = 5' not in build or 'versionName = "0.5.0"' not in build:
              raise SystemExit('Versão base 0.5.0 (5) não encontrada; abortando para evitar sobrescrever versão nova.')
          build = build.replace('versionCode = 5', 'versionCode = 6', 1)
          build = build.replace('versionName = "0.5.0"', 'versionName = "0.5.1"', 1)
          gradle.write_text(build)
          PY

          grep -n -A10 -B4 'Loja:.*offer.store' app/src/main/java/com/llins95/comparadordecerveja/ui/BeerApp.kt
          grep -n 'versionCode\|versionName' app/build.gradle.kts
          git diff --check

      - name: Unit tests
        run: gradle testDebugUnitTest

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Verify signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Repository Secret ausente: $variable"
              missing=1
            fi
          done
          exit "$missing"

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/cerva-release.jks

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/app/cerva-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Verify signature and prepare release files
        run: |
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$apksigner_path" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/Cerva.apk
          (cd release && sha256sum Cerva.apk > Cerva.apk.sha256)

      - name: Commit source change to main
        id: source_commit
        run: |
          rm .github/workflows/apply-top5-store-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/src/main/java/com/llins95/comparadordecerveja/ui/BeerApp.kt app/build.gradle.kts .github/workflows/apply-top5-store-release.yml
          git diff --cached --check
          git commit -m "Cerva 0.5.1: mostrar loja no Top 5"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Ensure release is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 'v0.5.1+6'; then
            echo '::error::A versão v0.5.1+6 já existe.'
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.source_commit.outputs.sha }}
        run: |
          gh release create 'v0.5.1+6' \
            release/Cerva.apk \
            release/Cerva.apk.sha256 \
            --target "$TARGET_SHA" \
            --title 'Cerva 0.5.1' \
            --notes 'Correção: o Top 5 da aba Início agora exibe a loja responsável por cada promoção cadastrada.'

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: cerva-signed-v0.5.1+6
          path: |
            release/Cerva.apk
            release/Cerva.apk.sha256
          if-no-files-found: error
          retention-days: 90
