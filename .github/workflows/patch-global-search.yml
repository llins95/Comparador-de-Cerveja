name: Apply global promotion search

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/patch-global-search.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.0

      - name: Apply feature
        run: python .github/patch_global_search.py

      - name: Validate
        run: gradle testDebugUnitTest assembleDebug

      - name: Commit feature
        run: |
          rm .github/workflows/patch-global-search.yml
          rm .github/patch_global_search.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+llins95@users.noreply.github.com"
          git add -A
          git commit -m "feat: adicionar busca global de promoções"
          git push
